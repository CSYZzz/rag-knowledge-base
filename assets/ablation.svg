<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" width="760" height="430" role="img" aria-labelledby="t d">
  <title id="t">两套向量后端在四种检索配置下的 Top-1 命中率对比</title>
  <desc id="d">bge-small-zh 后端为 43.5、69.6、78.3、97.8 百分比，bge-m3 后端为 63.0、80.4、84.8、97.8 百分比。两者差距依次收窄，最终都触及 97.8% 的题库上限。</desc>

  <rect width="760" height="430" fill="#ffffff"/>

  <g font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif">
    <g stroke="#e8e8e8" stroke-width="1">

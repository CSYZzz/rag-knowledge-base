    <text x="64" y="44" font-size="11" fill="#c0392b">题库上限 97.8%（45 题全中，剩余 1 题文档里没有答案）</text>

    <g>
      <rect x="91.75" y="213.85" width="48" height="126.15" fill="#9AA0A6" rx="2"/>
      <rect x="259.25" y="138.16" width="48" height="201.84" fill="#9AA0A6" rx="2"/>
